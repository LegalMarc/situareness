name: Public CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python lint tools
        run: python3 -m pip install --no-cache-dir ruff

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Ruff lint check
        run: ruff check custom_components/situareness tests/ha tools/package.py tools/check_public_hygiene.py

      - name: Run Ruff format check
        run: ruff format --check custom_components/situareness tests/ha tools/package.py tools/check_public_hygiene.py

      - name: Run static, runtime, HA, and skill checks
        run: npm run check

      - name: Run Home Assistant tests with dev and warning-as-error flags
        run: python3 -X dev -W error -m unittest discover -s tests/ha -p 'test_*.py'

      - name: Run public hygiene and reproducible packaging gate
        run: python3 tools/check_public_hygiene.py

      - name: Run Playwright browser tests
        run: npm run test:browser
